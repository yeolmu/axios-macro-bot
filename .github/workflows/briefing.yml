name: Macro Gorilla Briefing

on:
  push:
    paths:
      - '*.py'
      - 'templates/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  schedule:
    # Wednesday and Saturday 10:00 KST = 01:00 UTC. Actions may start late.
    - cron: '0 1 * * 3,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate preview only; no send, claim, or cursor changes'
        type: boolean
        default: true
      cutoff:
        description: 'Optional dry-run cutoff (ISO 8601 with +09:00); blank = latest Wed/Sat 10:00 slot'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: macro-gorilla-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Generate briefing or read-only preview
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SEMAFOR_EMAIL_PASS: ${{ secrets.SEMAFOR_EMAIL_PASS }}
          DRY_RUN: ${{ inputs.dry_run }}
          CUTOFF: ${{ inputs.cutoff }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "false" ]]; then args+=(--dry-run); fi
          if [[ -n "$CUTOFF" ]]; then args+=(--cutoff "$CUTOFF"); fi
          python briefing.py "${args[@]}"
      # Preview files remain ephemeral on the runner. This public repository must
      # never upload private Gmail-derived HTML/EML/JSON artifacts.
