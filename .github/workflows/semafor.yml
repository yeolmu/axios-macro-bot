name: Semafor Daily Brief

on:
  schedule:
    # Same-day KST receipt window, weekdays at 23:30 KST.
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      digest_date:
        description: "KST receipt date (YYYY-MM-DD); blank means today"
        required: false
        type: string
      dry_run:
        description: "Generate without sending or reserving the date"
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: semafor-daily
  cancel-in-progress: false

jobs:
  semafor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Generate and send daily Semafor digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SEMAFOR_EMAIL_USER: sub.seounyeol@gmail.com
          SEMAFOR_EMAIL_PASS: ${{ secrets.SEMAFOR_EMAIL_PASS }}
          DIGEST_DATE: ${{ inputs.digest_date }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        shell: bash
        run: |
          args=()
          if [[ -n "$DIGEST_DATE" ]]; then args+=(--date "$DIGEST_DATE"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run --output semafor-preview.eml); fi
          python semafor.py "${args[@]}"
      - name: Save manual dry-run preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: semafor-preview
          path: semafor-preview.eml
          if-no-files-found: ignore
          retention-days: 1
